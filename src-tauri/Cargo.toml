[package]
name = "dsh-gui"
version = "0.1.0"
description = "Desktop shell for the DeepSeek Harness web UI: launches the globally installed `dsh web` and shows it in a native window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
