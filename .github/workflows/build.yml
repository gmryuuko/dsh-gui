name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh
        working-directory: src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate SHA-256 checksum
        run: |
          $hash = (Get-FileHash target/release/dsh-gui.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dsh-gui.exe" | Set-Content target/release/dsh-gui.exe.sha256 -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-gui-windows-x64
          path: |
            src-tauri/target/release/dsh-gui.exe
            src-tauri/target/release/dsh-gui.exe.sha256
          if-no-files-found: error
          retention-days: 14
